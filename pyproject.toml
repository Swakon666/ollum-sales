[project]
name = "ollum-sales-mcp"
version = "0.7.0"
description = "Ollum Group MCP server combining full-source ScrapeGraphAI and WhatsApp MCP upstream projects"
requires-python = ">=3.12,<4.0"
dependencies = [
  "authlib>=1.7,<2",
  "beautifulsoup4>=4.12,<5",
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "mcp[cli]>=1.29,<2",
  "msgpack>=1.2.1,<2",
  "PyJWT[crypto]>=2.13,<3",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
