name: Production deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect/expand storage, deploy the current ref, or roll back one release
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - diagnose-space
          - deep-diagnose-space
          - expand-root-lvm
          - recover-space
          - deploy
          - deploy-prebuilt
          - rollback
          - verify-autopilot
          - verify-whatsapp
          - report-autopilot
          - reset-prospecting
          - connect-whatsapp
          - deploy-whatsapp-prebuilt
          - rollback-whatsapp
      recovery_target_ids:
        description: Comma-separated BuildKit cache record ID and failed Ollum release ID
        type: string
        required: false
      prebuilt_release_tag:
        description: GitHub release tag containing the prebuilt MCP image
        type: string
        required: false
      prebuilt_asset_name:
        description: Prebuilt gzip-compressed docker-save asset name
        type: string
        required: false
      prebuilt_sha256:
        description: Expected SHA-256 of the prebuilt image asset
        type: string
        required: false
      prebuilt_image_tag:
        description: Tag loaded from the prebuilt MCP image archive
        type: string
        required: false
      prebuilt_image_id:
        description: Expected sha256 Docker image ID after loading
        type: string
        required: false
      whatsapp_prebuilt_release_tag:
        description: GitHub release tag containing the prebuilt WhatsApp bridge binary
        type: string
        required: false
      whatsapp_prebuilt_asset_name:
        description: Prebuilt static Linux WhatsApp bridge binary asset name
        type: string
        required: false
      whatsapp_prebuilt_sha256:
        description: Expected SHA-256 of the prebuilt WhatsApp binary asset
        type: string
        required: false
      reset_prospecting_leads:
        description: Exact prospecting lead count from the approved reset preview
        type: string
        required: false
      reset_campaigns:
        description: Exact campaign count from the approved reset preview
        type: string
        required: false
      reset_inbox_events:
        description: Exact inbound event count that must be preserved
        type: string
        required: false
      reset_confirmation:
        description: Exact phrase RESET <leads> <campaigns> PRESERVE <inbox>
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ollum-sales-production
  cancel-in-progress: false

jobs:
  production:
    name: ${{ inputs.mode }} production
    runs-on: >-
      ${{ fromJSON(
          (inputs.mode == 'diagnose-space' || inputs.mode == 'recover-space') &&
          '["ubuntu-latest"]' ||
          '["self-hosted","linux","x64","ollum-sales-production"]'
        ) }}
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      SSH_HOST: ${{ secrets.OLLUM_SSH_HOST }}
      SSH_PORT: ${{ secrets.OLLUM_SSH_PORT }}
      SSH_USER: ${{ secrets.OLLUM_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.OLLUM_SSH_PASSWORD }}
      SSHPASS: ${{ secrets.OLLUM_SSH_PASSWORD }}
      SSH_HOST_KEY: ${{ secrets.OLLUM_SSH_HOST_KEY }}
      OLLUM_DOMAIN: ${{ secrets.OLLUM_DOMAIN }}
      OLLUM_API_DOMAIN: ${{ vars.OLLUM_API_DOMAIN }}
      MCP_BEARER_TOKEN: ${{ secrets.OLLUM_MCP_BEARER_TOKEN }}
      AUTH_MODE: ${{ vars.OLLUM_AUTH_MODE }}
      PUBLIC_BASE_URL: ${{ vars.OLLUM_PUBLIC_BASE_URL }}
      DASHBOARD_BASE_URL: ${{ vars.OLLUM_DASHBOARD_BASE_URL }}
      OIDC_REDIRECT_BASE_URL: ${{ vars.OLLUM_OIDC_REDIRECT_BASE_URL }}
      MCP_RESOURCE_URL: ${{ vars.OLLUM_MCP_RESOURCE_URL }}
      MCP_REQUIRED_SCOPES: ${{ vars.OLLUM_MCP_REQUIRED_SCOPES }}
      OAUTH_DCR_ENABLED: ${{ vars.OLLUM_OAUTH_DCR_ENABLED }}
      OAUTH_STORAGE_SECRET: ${{ secrets.OLLUM_OAUTH_STORAGE_SECRET }}
      OAUTH_ALLOWED_REDIRECT_HOSTS: ${{ vars.OLLUM_OAUTH_ALLOWED_REDIRECT_HOSTS }}
      OIDC_ISSUER_URL: ${{ vars.OLLUM_OIDC_ISSUER_URL }}
      OIDC_AUDIENCE: ${{ vars.OLLUM_OIDC_AUDIENCE }}
      OIDC_JWKS_URL: ${{ vars.OLLUM_OIDC_JWKS_URL }}
      OIDC_ALGORITHMS: ${{ vars.OLLUM_OIDC_ALGORITHMS }}
      OIDC_ALLOWED_SUBJECTS: ${{ secrets.OLLUM_OIDC_ALLOWED_SUBJECTS }}
      ADMIN_ENABLED: ${{ vars.OLLUM_ADMIN_ENABLED }}
      ADMIN_OIDC_CLIENT_ID: ${{ vars.OLLUM_ADMIN_OIDC_CLIENT_ID }}
      ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.OLLUM_ADMIN_OIDC_CLIENT_SECRET }}
      ADMIN_ALLOWED_EMAILS: ${{ secrets.OLLUM_ADMIN_ALLOWED_EMAILS }}
      ADMIN_SESSION_SECRET: ${{ secrets.OLLUM_ADMIN_SESSION_SECRET }}
      ADMIN_SESSION_MAX_AGE_SECONDS: ${{ vars.OLLUM_ADMIN_SESSION_MAX_AGE_SECONDS }}
      DEFAULT_WORKSPACE_ID: ${{ vars.OLLUM_DEFAULT_WORKSPACE_ID }}
      DEFAULT_WORKSPACE_NAME: ${{ vars.OLLUM_DEFAULT_WORKSPACE_NAME }}
      WORKSPACE_OWNER_EMAILS: ${{ secrets.OLLUM_WORKSPACE_OWNER_EMAILS }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GOOGLE_SHEETS_ID: ${{ vars.OLLUM_GOOGLE_SHEETS_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.OLLUM_GOOGLE_SERVICE_ACCOUNT_JSON }}
      WHATSAPP_PROXY_URL: ${{ secrets.OLLUM_WHATSAPP_PROXY_URL }}
      WHATSAPP_TEST_RECIPIENTS: ${{ secrets.OLLUM_WHATSAPP_TEST_RECIPIENTS }}
      MCP_BIND_PORT: "18000"
      PREBUILT_RELEASE_TAG: ${{ inputs.prebuilt_release_tag }}
      PREBUILT_ASSET_NAME: ${{ inputs.prebuilt_asset_name }}
      PREBUILT_SHA256: ${{ inputs.prebuilt_sha256 }}
      PREBUILT_IMAGE_TAG: ${{ inputs.prebuilt_image_tag }}
      PREBUILT_IMAGE_ID: ${{ inputs.prebuilt_image_id }}
      WHATSAPP_PREBUILT_RELEASE_TAG: ${{ inputs.whatsapp_prebuilt_release_tag }}
      WHATSAPP_PREBUILT_ASSET_NAME: ${{ inputs.whatsapp_prebuilt_asset_name }}
      WHATSAPP_PREBUILT_SHA256: ${{ inputs.whatsapp_prebuilt_sha256 }}
      RESET_PROSPECTING_LEADS: ${{ inputs.reset_prospecting_leads }}
      RESET_CAMPAIGNS: ${{ inputs.reset_campaigns }}
      RESET_INBOX_EVENTS: ${{ inputs.reset_inbox_events }}
      RESET_CONFIRMATION: ${{ inputs.reset_confirmation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD SSH_HOST_KEY OLLUM_DOMAIN; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret for ${name} is not configured" >&2
              exit 1
            fi
          done
          auth_mode=${AUTH_MODE:-bearer}
          case "$auth_mode" in
            bearer|oidc) ;;
            *) echo 'OLLUM_AUTH_MODE must be bearer or oidc in production' >&2; exit 1 ;;
          esac
          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]] && [ "$auth_mode" = bearer ] \
            && [ -z "${MCP_BEARER_TOKEN:-}" ]; then
              echo 'OLLUM_MCP_BEARER_TOKEN is required for bearer deployment' >&2
              exit 1
          fi
          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]] && [ "$auth_mode" = oidc ]; then
            for name in PUBLIC_BASE_URL OIDC_ISSUER_URL OIDC_AUDIENCE; do
              if [ -z "${!name:-}" ]; then
                echo "${name} is required for OIDC deployment" >&2
                exit 1
              fi
            done
            if [ "${ADMIN_ENABLED:-false}" = true ]; then
              for name in ADMIN_OIDC_CLIENT_ID ADMIN_OIDC_CLIENT_SECRET ADMIN_ALLOWED_EMAILS ADMIN_SESSION_SECRET; do
                if [ -z "${!name:-}" ]; then
                  echo "${name} is required for the closed-beta admin" >&2
                  exit 1
                fi
              done
            fi
            if [ "${OAUTH_DCR_ENABLED:-false}" = true ]; then
              if [ "${ADMIN_ENABLED:-false}" != true ]; then
                echo "OAUTH_DCR_ENABLED requires ADMIN_ENABLED=true" >&2
                exit 1
              fi
              if [ "${#OAUTH_STORAGE_SECRET}" -lt 32 ]; then
                echo "OAUTH_STORAGE_SECRET must contain at least 32 bytes" >&2
                exit 1
              fi
            fi
          fi
          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]] && [ -z "${GOOGLE_SHEETS_ID:-}" ]; then
            echo 'OLLUM_GOOGLE_SHEETS_ID repository variable is required for deployment' >&2
            exit 1
          fi
          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]] && [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'OLLUM_GOOGLE_SERVICE_ACCOUNT_JSON repository secret is required for deployment' >&2
            exit 1
          fi
          if [ "$DEPLOY_MODE" = connect-whatsapp ] && [ -z "${WHATSAPP_PROXY_URL:-}" ]; then
            echo 'OLLUM_WHATSAPP_PROXY_URL production secret is required for WhatsApp pairing' >&2
            exit 1
          fi
          if [ "$DEPLOY_MODE" = deploy-prebuilt ]; then
            [[ "$PREBUILT_RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid prebuilt release tag' >&2; exit 1; }
            [[ "$PREBUILT_ASSET_NAME" =~ ^[A-Za-z0-9._-]+\.tar\.gz$ ]] || { echo 'Invalid prebuilt asset name' >&2; exit 1; }
            [[ "$PREBUILT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo 'Invalid prebuilt SHA-256' >&2; exit 1; }
            [[ "$PREBUILT_IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid prebuilt image tag' >&2; exit 1; }
            [[ "$PREBUILT_IMAGE_ID" =~ ^sha256:[A-Fa-f0-9]{64}$ ]] || { echo 'Invalid prebuilt image ID' >&2; exit 1; }
          fi
          if [ "$DEPLOY_MODE" = deploy-whatsapp-prebuilt ]; then
            [[ "$WHATSAPP_PREBUILT_RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid WhatsApp prebuilt release tag' >&2; exit 1; }
            [[ "$WHATSAPP_PREBUILT_ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid WhatsApp prebuilt asset name' >&2; exit 1; }
            [[ "$WHATSAPP_PREBUILT_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo 'Invalid WhatsApp prebuilt SHA-256' >&2; exit 1; }
          fi
          if [ "$DEPLOY_MODE" = reset-prospecting ]; then
            [[ "${RESET_PROSPECTING_LEADS:-}" =~ ^[0-9]+$ ]] || {
              echo 'reset_prospecting_leads must be an exact non-negative integer' >&2
              exit 1
            }
            [[ "${RESET_CAMPAIGNS:-}" =~ ^[0-9]+$ ]] || {
              echo 'reset_campaigns must be an exact non-negative integer' >&2
              exit 1
            }
            [[ "${RESET_INBOX_EVENTS:-}" =~ ^[0-9]+$ ]] || {
              echo 'reset_inbox_events must be an exact non-negative integer' >&2
              exit 1
            }
            expected_confirmation="RESET ${RESET_PROSPECTING_LEADS} ${RESET_CAMPAIGNS} PRESERVE ${RESET_INBOX_EVENTS}"
            [ "${RESET_CONFIRMATION:-}" = "$expected_confirmation" ] || {
              echo 'reset_confirmation does not match the exact approved counts' >&2
              exit 1
            }
          fi
          [[ "$SSH_PORT" =~ ^[0-9]{2,5}$ ]] || { echo 'Invalid SSH port' >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid SSH user' >&2; exit 1; }
          [[ "$OLLUM_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid domain' >&2; exit 1; }
          if [ -n "${OLLUM_API_DOMAIN:-}" ]; then
            [[ "$OLLUM_API_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] \
              || { echo 'Invalid API domain' >&2; exit 1; }
          fi
          [[ "$SSH_HOST_KEY" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Invalid SSH host key fingerprint' >&2; exit 1; }
          [[ "$GOOGLE_SHEETS_ID" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo 'Invalid Google Sheets ID' >&2; exit 1; }
          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$MCP_BEARER_TOKEN"
          for value in "${ADMIN_OIDC_CLIENT_SECRET:-}" "${ADMIN_ALLOWED_EMAILS:-}" \
            "${ADMIN_SESSION_SECRET:-}" "${OAUTH_STORAGE_SECRET:-}" \
            "${OIDC_ALLOWED_SUBJECTS:-}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done
          if [ -n "${WHATSAPP_PROXY_URL:-}" ]; then
            echo "::add-mask::$WHATSAPP_PROXY_URL"
          fi

      - name: Validate runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in bash curl gzip python3 scp sha256sum ssh ssh-keyscan ssh-keygen sshpass tar; do
            command -v "$command_name" >/dev/null || {
              echo "Required runner command is missing: $command_name" >&2
              exit 1
            }
          done
          if [ "$DEPLOY_MODE" = deploy-whatsapp-prebuilt ]; then
            command -v cp >/dev/null || {
              echo 'Required runner command is missing: cp' >&2
              exit 1
            }
          fi

      - name: Pin SSH host key
        shell: bash
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/known_hosts"
          scanned=false
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -t ed25519 -p "$SSH_PORT" -T 15 "$SSH_HOST" > "$known_hosts" \
              && [ -s "$known_hosts" ]; then
              scanned=true
              break
            fi
            echo "SSH host key scan attempt $attempt failed; retrying" >&2
            sleep 10
          done
          [ "$scanned" = true ] || { echo 'Unable to scan SSH host key after retries' >&2; exit 1; }
          chmod 600 "$known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$known_hosts" | awk 'NR == 1 {print $2}')
          if [ "$actual_fingerprint" != "$SSH_HOST_KEY" ]; then
            echo 'SSH host key fingerprint does not match OLLUM_SSH_HOST_KEY' >&2
            exit 1
          fi
          echo "SSH host key verified: $actual_fingerprint"

      - name: Read-only server preflight
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' < deploy/server_preflight.sh

      - name: Read-only Docker space diagnostics
        if: ${{ env.DEPLOY_MODE == 'diagnose-space' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/space_diagnostics.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Read-only deep filesystem diagnostics
        if: ${{ env.DEPLOY_MODE == 'deep-diagnose-space' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/deep_space_diagnostics.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Expand verified root LVM chain
        if: ${{ env.DEPLOY_MODE == 'expand-root-lvm' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/expand_root_lvm.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s"

      - name: Reclaim verified failed Ollum build artifacts
        if: ${{ env.DEPLOY_MODE == 'recover-space' }}
        shell: bash
        env:
          RECOVERY_TARGET_IDS: ${{ inputs.recovery_target_ids }}
        run: |
          set -euo pipefail
          IFS=, read -r CACHE_RECORD_ID FAILED_RELEASE_ID EXTRA_TARGET <<< "$RECOVERY_TARGET_IDS"
          [ -n "$CACHE_RECORD_ID" ] || { echo 'recovery_target_ids must include a cache record ID' >&2; exit 1; }
          [ -n "$FAILED_RELEASE_ID" ] || { echo 'recovery_target_ids must include a failed release ID' >&2; exit 1; }
          [ -z "$EXTRA_TARGET" ] || { echo 'recovery_target_ids must contain exactly two values' >&2; exit 1; }
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/space_recovery.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$CACHE_RECORD_ID' '$FAILED_RELEASE_ID'"

      - name: Prepare encrypted deployment payload
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'deploy-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          incoming_path=".ollum-sales-incoming/$release_id"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "INCOMING_PATH=$incoming_path" >> "$GITHUB_ENV"

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=work \
            --exclude=outputs \
            -czf "$RUNNER_TEMP/release.tgz" .

          auth_mode=${AUTH_MODE:-bearer}
          public_base_url=${PUBLIC_BASE_URL:-https://$OLLUM_DOMAIN}
          api_domain=${OLLUM_API_DOMAIN:-$OLLUM_DOMAIN}
          dashboard_base_url=${DASHBOARD_BASE_URL:-https://$api_domain}
          oidc_redirect_base_url=${OIDC_REDIRECT_BASE_URL:-https://$OLLUM_DOMAIN}
          mcp_resource_url=${MCP_RESOURCE_URL:-$public_base_url/mcp}
          mcp_required_scopes=${MCP_REQUIRED_SCOPES:-sales:read,sales:write}
          oidc_algorithms=${OIDC_ALGORITHMS:-RS256}
          admin_enabled=${ADMIN_ENABLED:-false}
          admin_session_max_age=${ADMIN_SESSION_MAX_AGE_SECONDS:-28800}

          umask 077
          credentials_file="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python3 - "$credentials_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          required = ("type", "client_email", "private_key", "token_uri")
          if payload.get("type") != "service_account" or any(
              not payload.get(field) for field in required
          ):
              raise SystemExit("invalid Google service-account credential")
          PY
          {
            printf 'MCP_HOST=0.0.0.0\n'
            printf 'MCP_PORT=8000\n'
            printf 'OLLUM_MCP_BIND_PORT=%s\n' "$MCP_BIND_PORT"
            printf 'OLLUM_MCP_REQUIRE_AUTH=true\n'
            printf 'OLLUM_MCP_BEARER_TOKEN=%s\n' "$MCP_BEARER_TOKEN"
            printf 'OLLUM_AUTH_MODE=%s\n' "$auth_mode"
            printf 'OLLUM_PUBLIC_BASE_URL=%s\n' "$public_base_url"
            printf 'OLLUM_DASHBOARD_BASE_URL=%s\n' "$dashboard_base_url"
            printf 'OLLUM_OIDC_REDIRECT_BASE_URL=%s\n' "$oidc_redirect_base_url"
            printf 'OLLUM_MCP_RESOURCE_URL=%s\n' "$mcp_resource_url"
            printf 'OLLUM_MCP_REQUIRED_SCOPES=%s\n' "$mcp_required_scopes"
            printf 'OLLUM_OAUTH_DCR_ENABLED=%s\n' "${OAUTH_DCR_ENABLED:-false}"
            printf 'OLLUM_OAUTH_STORAGE_SECRET=%s\n' "${OAUTH_STORAGE_SECRET:-}"
            printf 'OLLUM_OAUTH_ALLOWED_REDIRECT_HOSTS=%s\n' "${OAUTH_ALLOWED_REDIRECT_HOSTS:-chatgpt.com}"
            printf 'OLLUM_OIDC_ISSUER_URL=%s\n' "${OIDC_ISSUER_URL:-}"
            printf 'OLLUM_OIDC_AUDIENCE=%s\n' "${OIDC_AUDIENCE:-}"
            printf 'OLLUM_OIDC_JWKS_URL=%s\n' "${OIDC_JWKS_URL:-}"
            printf 'OLLUM_OIDC_ALGORITHMS=%s\n' "$oidc_algorithms"
            printf 'OLLUM_OIDC_ALLOWED_SUBJECTS=%s\n' "${OIDC_ALLOWED_SUBJECTS:-}"
            printf 'OLLUM_ADMIN_ENABLED=%s\n' "$admin_enabled"
            printf 'OLLUM_ADMIN_OIDC_CLIENT_ID=%s\n' "${ADMIN_OIDC_CLIENT_ID:-}"
            printf 'OLLUM_ADMIN_OIDC_CLIENT_SECRET=%s\n' "${ADMIN_OIDC_CLIENT_SECRET:-}"
            printf 'OLLUM_ADMIN_ALLOWED_EMAILS=%s\n' "${ADMIN_ALLOWED_EMAILS:-}"
            printf 'OLLUM_ADMIN_READ_SCOPE=sales:read\n'
            printf 'OLLUM_ADMIN_WRITE_SCOPE=sales:write\n'
            printf 'OLLUM_ADMIN_SESSION_SECRET=%s\n' "${ADMIN_SESSION_SECRET:-}"
            printf 'OLLUM_ADMIN_SESSION_MAX_AGE_SECONDS=%s\n' "$admin_session_max_age"
            printf 'OLLUM_DEFAULT_WORKSPACE_ID=%s\n' "${DEFAULT_WORKSPACE_ID:-ollum-group}"
            printf 'OLLUM_DEFAULT_WORKSPACE_NAME=%s\n' "${DEFAULT_WORKSPACE_NAME:-Ollum Group}"
            printf 'OLLUM_WORKSPACE_OWNER_EMAILS=%s\n' "${WORKSPACE_OWNER_EMAILS:-${ADMIN_ALLOWED_EMAILS:-}}"
            printf 'OLLUM_CONVERSATION_AGENT_ENABLED=true\n'
            printf 'OLLUM_CONVERSATION_AGENT_POLL_SECONDS=900\n'
            printf 'OLLUM_CONVERSATION_AGENT_BATCH_SIZE=3\n'
            printf 'SERPER_API_KEY=%s\n' "${SERPER_API_KEY:-}"
            printf 'WHATSAPP_API_BASE_URL=http://whatsapp-bridge:8080/api\n'
            printf 'WHATSAPP_MESSAGES_DB_PATH=/data/whatsapp/messages.db\n'
            printf 'WHATSAPP_PROXY_URL=%s\n' "${WHATSAPP_PROXY_URL:-}"
            printf 'OLLUM_ALLOW_WHATSAPP_SEND=false\n'
            printf 'OLLUM_WHATSAPP_TEST_RECIPIENTS=%s\n' "${WHATSAPP_TEST_RECIPIENTS:-}"
            printf 'OLLUM_AUTOPILOT_ALLOW_SEND=false\n'
            printf 'OLLUM_AUTOPILOT_DEFAULT_MODE=safe\n'
            printf 'OLLUM_AUTOPILOT_INTERVAL_MINUTES=45\n'
            printf 'OLLUM_GOOGLE_SHEETS_ENABLED=true\n'
            printf 'OLLUM_GOOGLE_SHEETS_ID=%s\n' "$GOOGLE_SHEETS_ID"
            printf 'GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/ollum-google-service-account.json\n'
            printf 'OLLUM_GOOGLE_SERVICE_ACCOUNT_HOST_FILE=../../shared/secrets/ollum-google-service-account.json\n'
          } > "$RUNNER_TEMP/production.env"
          chmod 600 "$RUNNER_TEMP/release.tgz" "$RUNNER_TEMP/production.env" "$credentials_file"

      - name: Download and verify prebuilt MCP image
        if: ${{ env.DEPLOY_MODE == 'deploy-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          image_archive="$RUNNER_TEMP/ollum-sales-mcp-image.tar.gz"
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$PREBUILT_RELEASE_TAG/$PREBUILT_ASSET_NAME"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$image_archive" \
            "$asset_url"
          printf '%s  %s\n' "$PREBUILT_SHA256" "$image_archive" | sha256sum --check --strict
          gzip --test "$image_archive"
          chmod 600 "$image_archive"

      - name: Download and verify prebuilt WhatsApp binary
        if: ${{ env.DEPLOY_MODE == 'deploy-whatsapp-prebuilt' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ollum-sales-whatsapp-bridge"
          release_json="$RUNNER_TEMP/whatsapp-release.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$WHATSAPP_PREBUILT_RELEASE_TAG" \
            > "$release_json"
          asset_id=$(python3 - "$release_json" "$WHATSAPP_PREBUILT_ASSET_NAME" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              release = json.load(handle)
          matches = [asset["id"] for asset in release.get("assets", []) if asset.get("name") == sys.argv[2]]
          if len(matches) != 1:
              raise SystemExit("expected exactly one matching WhatsApp binary asset")
          print(matches[0])
          PY
          )
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            --output "$binary"
          printf '%s  %s\n' "$WHATSAPP_PREBUILT_SHA256" "$binary" \
            | sha256sum --check --strict
          python3 - "$binary" <<'PY'
          import pathlib
          import struct
          import sys

          header = pathlib.Path(sys.argv[1]).read_bytes()[:20]
          if len(header) < 20 or header[:4] != b"\x7fELF" or header[4:6] != b"\x02\x01":
              raise SystemExit("WhatsApp artifact is not a 64-bit little-endian ELF binary")
          if struct.unpack_from("<H", header, 18)[0] != 62:
              raise SystemExit("WhatsApp artifact is not an x86-64 binary")
          PY
          chmod 600 "$binary"
          echo "WHATSAPP_PREBUILT_LOCAL_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Transfer prebuilt WhatsApp image
        if: ${{ env.DEPLOY_MODE == 'deploy-whatsapp-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          incoming_path=".ollum-sales-incoming/whatsapp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && mkdir -p '$incoming_path'"
          sshpass -e scp \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -P "$SSH_PORT" \
            "$WHATSAPP_PREBUILT_LOCAL_BINARY" \
            "$SSH_USER@$SSH_HOST:$incoming_path/whatsapp-bridge"
          echo "WHATSAPP_PREBUILT_REMOTE_BINARY=$incoming_path/whatsapp-bridge" >> "$GITHUB_ENV"

      - name: Deploy only prebuilt WhatsApp bridge
        if: ${{ env.DEPLOY_MODE == 'deploy-whatsapp-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/deploy_whatsapp_prebuilt.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$WHATSAPP_PREBUILT_REMOTE_BINARY' '$WHATSAPP_PREBUILT_SHA256'"

      - name: Roll back only WhatsApp bridge
        if: ${{ env.DEPLOY_MODE == 'rollback-whatsapp' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/rollback_whatsapp.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Transfer release over SSH
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'deploy-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p \"\$HOME/$INCOMING_PATH\""
          transfer_files=(
            "$RUNNER_TEMP/release.tgz"
            "$RUNNER_TEMP/production.env"
            "$RUNNER_TEMP/google-service-account.json"
          )
          if [ "$DEPLOY_MODE" = deploy-prebuilt ]; then
            transfer_files+=("$RUNNER_TEMP/ollum-sales-mcp-image.tar.gz")
          fi
          sshpass -e scp \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -P "$SSH_PORT" \
            "${transfer_files[@]}" \
            "$SSH_USER@$SSH_HOST:$INCOMING_PATH/"
          rm -f -- "$RUNNER_TEMP/google-service-account.json"

      - name: Deploy release
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'deploy-prebuilt' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/remote_deploy.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$OLLUM_DOMAIN' '$RELEASE_ID' '$INCOMING_PATH' '$MCP_BIND_PORT' '$PREBUILT_IMAGE_TAG' '$PREBUILT_IMAGE_ID' '$PREBUILT_SHA256' '${OLLUM_API_DOMAIN:-$OLLUM_DOMAIN}'"
          echo "DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Roll back to previous release
        if: ${{ env.DEPLOY_MODE == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/remote_rollback.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$OLLUM_DOMAIN' '$MCP_BIND_PORT'"

      - name: Verify production endpoints through local Nginx
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'deploy-prebuilt' || env.DEPLOY_MODE == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
            "https://$OLLUM_DOMAIN/health" >/dev/null

          unauthorized_status=$(curl --silent --show-error --max-time 20 \
            --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
            --output /dev/null --write-out '%{http_code}' \
            "https://$OLLUM_DOMAIN/mcp")
          [ "$unauthorized_status" = 401 ] || {
            echo "Expected unauthenticated /mcp to return 401, got $unauthorized_status" >&2
            exit 1
          }

          api_domain=${OLLUM_API_DOMAIN:-$OLLUM_DOMAIN}
          curl --fail --silent --show-error --max-time 20 \
            --resolve "$api_domain:443:127.0.0.1" \
            "https://$api_domain/health" >/dev/null

          if [ "${ADMIN_ENABLED:-false}" = true ]; then
            admin_status=$(curl --silent --show-error --max-time 20 \
              --resolve "$api_domain:443:127.0.0.1" \
              --output /dev/null --write-out '%{http_code}' \
              "https://$api_domain/admin")
            [[ "$admin_status" == 303 || "$admin_status" == 307 ]] || {
              echo "Expected unauthenticated /admin redirect, got $admin_status" >&2
              exit 1
            }
            login_headers=$(mktemp)
            provider_headers=$(mktemp)
            curl --silent --show-error --max-time 20 \
              --resolve "$api_domain:443:127.0.0.1" \
              --output /dev/null --dump-header "$login_headers" \
              "https://$api_domain/auth/login"
            login_location=$(awk 'tolower($1) == "location:" {$1=""; sub(/^ /, ""); print; exit}' \
              "$login_headers" | tr -d '\r')
            [ "$login_location" = "https://$OLLUM_DOMAIN/auth/login" ] || {
              echo "Dashboard login did not move OAuth state to the callback host" >&2
              exit 1
            }
            curl --silent --show-error --max-time 20 \
              --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
              --output /dev/null --dump-header "$provider_headers" \
              "$login_location"
            provider_location=$(awk 'tolower($1) == "location:" {$1=""; sub(/^ /, ""); print; exit}' \
              "$provider_headers" | tr -d '\r')
            expected_callback=$(python3 -c \
              'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "https://$OLLUM_DOMAIN/auth/callback")
            [[ "$provider_location" == *"redirect_uri=$expected_callback"* ]] || {
              echo "OIDC provider redirect does not use the configured MCP callback" >&2
              exit 1
            }
            rm -f -- "$login_headers" "$provider_headers"
            session_status=$(curl --silent --show-error --max-time 20 \
              --resolve "$api_domain:443:127.0.0.1" \
              --output /dev/null --write-out '%{http_code}' \
              "https://$api_domain/api/v1/session")
            [ "$session_status" = 401 ] || {
              echo "Expected unauthenticated /api/v1/session to return 401, got $session_status" >&2
              exit 1
            }
          fi

          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]]; then
            if [ "${AUTH_MODE:-bearer}" = oidc ]; then
              metadata_file=$(mktemp)
              headers_file=$(mktemp)
              expected_resource=${MCP_RESOURCE_URL:-https://$OLLUM_DOMAIN/mcp}
              expected_issuer=$OIDC_ISSUER_URL
              if [ "${OAUTH_DCR_ENABLED:-false}" = true ]; then
                expected_issuer="${PUBLIC_BASE_URL:-https://$OLLUM_DOMAIN}"
                expected_issuer="${expected_issuer%/}/"
              fi
              trap 'rm -f -- "$metadata_file" "$headers_file"' EXIT
              curl --fail --silent --show-error --max-time 20 \
                --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
                "https://$OLLUM_DOMAIN/.well-known/oauth-protected-resource/mcp" \
                > "$metadata_file"
              python3 - "$metadata_file" "$expected_issuer" "$expected_resource" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          if metadata.get("authorization_servers") != [sys.argv[2]]:
              raise SystemExit("unexpected OAuth authorization server metadata")
          if metadata.get("resource") != sys.argv[3]:
              raise SystemExit("unexpected OAuth resource metadata")
          if not {"sales:read", "sales:write"}.issubset(
              set(metadata.get("scopes_supported", []))
          ):
              raise SystemExit("required OAuth scopes are missing")
          PY
              if [ "${OAUTH_DCR_ENABLED:-false}" = true ]; then
                authorization_file=$(mktemp)
                curl --fail --silent --show-error --max-time 20 \
                  --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
                  "https://$OLLUM_DOMAIN/.well-known/oauth-authorization-server" \
                  > "$authorization_file"
                python3 - "$authorization_file" "${PUBLIC_BASE_URL:-https://$OLLUM_DOMAIN}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          base = sys.argv[2].rstrip("/")
          expected = {
              "authorization_endpoint": f"{base}/authorize",
              "token_endpoint": f"{base}/token",
              "registration_endpoint": f"{base}/register",
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"unexpected {key}")
          PY
                rm -f -- "$authorization_file"
              fi
              curl --silent --show-error --max-time 20 \
                --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
                --dump-header "$headers_file" --output /dev/null \
                "https://$OLLUM_DOMAIN/mcp"
              grep -Eiq '^www-authenticate: Bearer .*resource_metadata=' "$headers_file" || {
                echo 'OIDC challenge is missing resource_metadata' >&2
                exit 1
              }
            else
              authenticated_status=$(curl --silent --show-error --max-time 30 \
                --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
                --output /dev/null --write-out '%{http_code}' \
                -H "Authorization: Bearer $MCP_BEARER_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-check","version":"1"}}}' \
                "https://$OLLUM_DOMAIN/mcp")
              [ "$authenticated_status" = 200 ] || {
                echo "Authenticated /mcp check returned $authenticated_status" >&2
                exit 1
              }
            fi
          fi
          echo "VERIFICATION_SUCCEEDED=true" >> "$GITHUB_ENV"

      - name: Roll back deployment after failed endpoint verification
        if: >-
          ${{ failure() &&
              env.DEPLOY_COMPLETED == 'true' &&
              env.VERIFICATION_SUCCEEDED != 'true' &&
              (env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'deploy-prebuilt') }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/remote_rollback.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$OLLUM_DOMAIN' '$MCP_BIND_PORT'"

      - name: Verify one SAFE Autopilot cycle and worker persistence
        if: ${{ env.DEPLOY_MODE == 'verify-autopilot' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/verify_autopilot.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Report latest completed Autopilot cycle
        if: ${{ env.DEPLOY_MODE == 'report-autopilot' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/report_autopilot.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Reset approved prospecting data with a restorable backup
        if: ${{ env.DEPLOY_MODE == 'reset-prospecting' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/reset_prospecting.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$RESET_PROSPECTING_LEADS' '$RESET_CAMPAIGNS' '$RESET_INBOX_EVENTS' '$RESET_CONFIRMATION'"

      - name: Connect WhatsApp with a one-time QR code
        if: ${{ env.DEPLOY_MODE == 'connect-whatsapp' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/connect_whatsapp.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Verify WhatsApp session persistence after restart
        if: ${{ env.DEPLOY_MODE == 'connect-whatsapp' || env.DEPLOY_MODE == 'verify-whatsapp' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/verify_whatsapp_persistence.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

  public-verification:
    name: Verify public production endpoints
    needs: production
    if: >-
      ${{ inputs.mode == 'deploy' || inputs.mode == 'deploy-prebuilt' || inputs.mode == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      OLLUM_DOMAIN: ${{ secrets.OLLUM_DOMAIN }}
      OLLUM_API_DOMAIN: ${{ vars.OLLUM_API_DOMAIN }}
      MCP_BEARER_TOKEN: ${{ secrets.OLLUM_MCP_BEARER_TOKEN }}
      AUTH_MODE: ${{ vars.OLLUM_AUTH_MODE }}
      ADMIN_ENABLED: ${{ vars.OLLUM_ADMIN_ENABLED }}
      PUBLIC_BASE_URL: ${{ vars.OLLUM_PUBLIC_BASE_URL }}
      OAUTH_DCR_ENABLED: ${{ vars.OLLUM_OAUTH_DCR_ENABLED }}
      OIDC_ISSUER_URL: ${{ vars.OLLUM_OIDC_ISSUER_URL }}
      OIDC_AUDIENCE: ${{ vars.OLLUM_OIDC_AUDIENCE }}
      MCP_RESOURCE_URL: ${{ vars.OLLUM_MCP_RESOURCE_URL }}

    steps:
      - name: Verify public health and MCP authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://$OLLUM_DOMAIN/health" >/dev/null

          unauthorized_status=$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "https://$OLLUM_DOMAIN/mcp")
          [ "$unauthorized_status" = 401 ] || {
            echo "Expected unauthenticated /mcp to return 401, got $unauthorized_status" >&2
            exit 1
          }

          api_domain=${OLLUM_API_DOMAIN:-$OLLUM_DOMAIN}
          curl --fail --silent --show-error --max-time 20 \
            "https://$api_domain/health" >/dev/null
          if [ "${ADMIN_ENABLED:-false}" = true ]; then
            admin_status=$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://$api_domain/admin")
            [[ "$admin_status" == 303 || "$admin_status" == 307 ]] || {
              echo "Public /admin returned $admin_status instead of an auth redirect" >&2
              exit 1
            }
            login_headers=$(mktemp)
            provider_headers=$(mktemp)
            curl --silent --show-error --max-time 20 \
              --output /dev/null --dump-header "$login_headers" \
              "https://$api_domain/auth/login"
            login_location=$(awk 'tolower($1) == "location:" {$1=""; sub(/^ /, ""); print; exit}' \
              "$login_headers" | tr -d '\r')
            [ "$login_location" = "https://$OLLUM_DOMAIN/auth/login" ] || {
              echo "Public dashboard login did not move OAuth state to the callback host" >&2
              exit 1
            }
            curl --silent --show-error --max-time 20 \
              --output /dev/null --dump-header "$provider_headers" \
              "$login_location"
            provider_location=$(awk 'tolower($1) == "location:" {$1=""; sub(/^ /, ""); print; exit}' \
              "$provider_headers" | tr -d '\r')
            expected_callback=$(python3 -c \
              'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "https://$OLLUM_DOMAIN/auth/callback")
            [[ "$provider_location" == *"redirect_uri=$expected_callback"* ]] || {
              echo "Public OIDC redirect does not use the configured MCP callback" >&2
              exit 1
            }
            rm -f -- "$login_headers" "$provider_headers"
            session_status=$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://$api_domain/api/v1/session")
            [ "$session_status" = 401 ] || {
              echo "Public /api/v1/session returned $session_status instead of 401" >&2
              exit 1
            }
          fi

          if [[ "$DEPLOY_MODE" =~ ^deploy(-prebuilt)?$ ]]; then
            if [ "${AUTH_MODE:-bearer}" = oidc ]; then
              metadata_file=$(mktemp)
              headers_file=$(mktemp)
              expected_resource=${MCP_RESOURCE_URL:-https://$OLLUM_DOMAIN/mcp}
              expected_issuer=$OIDC_ISSUER_URL
              if [ "${OAUTH_DCR_ENABLED:-false}" = true ]; then
                expected_issuer="${PUBLIC_BASE_URL:-https://$OLLUM_DOMAIN}"
                expected_issuer="${expected_issuer%/}/"
              fi
              trap 'rm -f -- "$metadata_file" "$headers_file"' EXIT
              curl --fail --silent --show-error --max-time 20 \
                "https://$OLLUM_DOMAIN/.well-known/oauth-protected-resource/mcp" \
                > "$metadata_file"
              python3 - "$metadata_file" "$expected_issuer" "$expected_resource" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          if metadata.get("authorization_servers") != [sys.argv[2]]:
              raise SystemExit("unexpected public OAuth authorization server metadata")
          if metadata.get("resource") != sys.argv[3]:
              raise SystemExit("unexpected public OAuth resource metadata")
          PY
              curl --silent --show-error --max-time 20 \
                --dump-header "$headers_file" --output /dev/null \
                "https://$OLLUM_DOMAIN/mcp"
              grep -Eiq '^www-authenticate: Bearer .*resource_metadata=' "$headers_file" || {
                echo 'Public OIDC challenge is missing resource_metadata' >&2
                exit 1
              }
            else
              authenticated_status=$(curl --silent --show-error --max-time 30 \
                --output /dev/null --write-out '%{http_code}' \
                -H "Authorization: Bearer $MCP_BEARER_TOKEN" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-public-check","version":"1"}}}' \
                "https://$OLLUM_DOMAIN/mcp")
              [ "$authenticated_status" = 200 ] || {
                echo "Authenticated public /mcp check returned $authenticated_status" >&2
                exit 1
              }
            fi
          fi
