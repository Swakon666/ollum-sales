name: Production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Run preflight/space diagnostics, deploy the current ref, or roll back one release
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - diagnose-space
          - recover-space
          - deploy
          - rollback
          - verify-autopilot
      cache_record_id:
        description: Exact reclaimable BuildKit cache record ID from diagnose-space
        type: string
        required: false
      failed_release_id:
        description: Exact failed Ollum release ID to remove after verification
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ollum-sales-production
  cancel-in-progress: false

jobs:
  production:
    name: ${{ github.event_name == 'push' && 'Deploy' || inputs.mode }} production
    runs-on:
      - self-hosted
      - linux
      - x64
      - ollum-sales-production
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
      SSH_HOST: ${{ secrets.OLLUM_SSH_HOST }}
      SSH_PORT: ${{ secrets.OLLUM_SSH_PORT }}
      SSH_USER: ${{ secrets.OLLUM_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.OLLUM_SSH_PASSWORD }}
      SSHPASS: ${{ secrets.OLLUM_SSH_PASSWORD }}
      SSH_HOST_KEY: ${{ secrets.OLLUM_SSH_HOST_KEY }}
      OLLUM_DOMAIN: ${{ secrets.OLLUM_DOMAIN }}
      MCP_BEARER_TOKEN: ${{ secrets.OLLUM_MCP_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SCRAPEGRAPH_MODEL: ${{ secrets.SCRAPEGRAPH_MODEL }}
      GOOGLE_SHEETS_ID: ${{ vars.OLLUM_GOOGLE_SHEETS_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.OLLUM_GOOGLE_SERVICE_ACCOUNT_JSON }}
      MCP_BIND_PORT: "18000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD SSH_HOST_KEY OLLUM_DOMAIN; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret for ${name} is not configured" >&2
              exit 1
            fi
          done
          if [ "$DEPLOY_MODE" = deploy ] && [ -z "${MCP_BEARER_TOKEN:-}" ]; then
            echo 'OLLUM_MCP_BEARER_TOKEN is required for deployment' >&2
            exit 1
          fi
          if [ "$DEPLOY_MODE" = deploy ] && [ -z "${GOOGLE_SHEETS_ID:-}" ]; then
            echo 'OLLUM_GOOGLE_SHEETS_ID repository variable is required for deployment' >&2
            exit 1
          fi
          if [ "$DEPLOY_MODE" = deploy ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo 'OLLUM_GOOGLE_SERVICE_ACCOUNT_JSON repository secret is required for deployment' >&2
            exit 1
          fi
          [[ "$SSH_PORT" =~ ^[0-9]{2,5}$ ]] || { echo 'Invalid SSH port' >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid SSH user' >&2; exit 1; }
          [[ "$OLLUM_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid domain' >&2; exit 1; }
          [[ "$SSH_HOST_KEY" =~ ^SHA256:[A-Za-z0-9+/=]+$ ]] || { echo 'Invalid SSH host key fingerprint' >&2; exit 1; }
          [[ "$GOOGLE_SHEETS_ID" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo 'Invalid Google Sheets ID' >&2; exit 1; }
          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$MCP_BEARER_TOKEN"

      - name: Validate runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in bash curl python3 ssh ssh-keyscan ssh-keygen sshpass tar; do
            command -v "$command_name" >/dev/null || {
              echo "Required runner command is missing: $command_name" >&2
              exit 1
            }
          done

      - name: Pin SSH host key
        shell: bash
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/known_hosts"
          scanned=false
          for attempt in 1 2 3 4 5 6; do
            if ssh-keyscan -t ed25519 -p "$SSH_PORT" -T 15 "$SSH_HOST" > "$known_hosts" \
              && [ -s "$known_hosts" ]; then
              scanned=true
              break
            fi
            echo "SSH host key scan attempt $attempt failed; retrying" >&2
            sleep 10
          done
          [ "$scanned" = true ] || { echo 'Unable to scan SSH host key after retries' >&2; exit 1; }
          chmod 600 "$known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$known_hosts" | awk 'NR == 1 {print $2}')
          if [ "$actual_fingerprint" != "$SSH_HOST_KEY" ]; then
            echo 'SSH host key fingerprint does not match OLLUM_SSH_HOST_KEY' >&2
            exit 1
          fi
          echo "SSH host key verified: $actual_fingerprint"

      - name: Read-only server preflight
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' < deploy/server_preflight.sh

      - name: Read-only Docker space diagnostics
        if: ${{ env.DEPLOY_MODE == 'diagnose-space' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/space_diagnostics.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

      - name: Reclaim verified failed Ollum build artifacts
        if: ${{ env.DEPLOY_MODE == 'recover-space' }}
        shell: bash
        env:
          CACHE_RECORD_ID: ${{ inputs.cache_record_id }}
          FAILED_RELEASE_ID: ${{ inputs.failed_release_id }}
        run: |
          set -euo pipefail
          [ -n "$CACHE_RECORD_ID" ] || { echo 'cache_record_id is required' >&2; exit 1; }
          [ -n "$FAILED_RELEASE_ID" ] || { echo 'failed_release_id is required' >&2; exit 1; }
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/space_recovery.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$CACHE_RECORD_ID' '$FAILED_RELEASE_ID'"

      - name: Prepare encrypted deployment payload
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          incoming_path=".ollum-sales-incoming/$release_id"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "INCOMING_PATH=$incoming_path" >> "$GITHUB_ENV"

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=work \
            --exclude=outputs \
            -czf "$RUNNER_TEMP/release.tgz" .

          model=${SCRAPEGRAPH_MODEL:-openai/gpt-4o-mini}

          umask 077
          credentials_file="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python3 - "$credentials_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          required = ("type", "client_email", "private_key", "token_uri")
          if payload.get("type") != "service_account" or any(
              not payload.get(field) for field in required
          ):
              raise SystemExit("invalid Google service-account credential")
          PY
          {
            printf 'MCP_HOST=0.0.0.0\n'
            printf 'MCP_PORT=8000\n'
            printf 'OLLUM_MCP_BIND_PORT=%s\n' "$MCP_BIND_PORT"
            printf 'OLLUM_MCP_REQUIRE_AUTH=true\n'
            printf 'OLLUM_MCP_BEARER_TOKEN=%s\n' "$MCP_BEARER_TOKEN"
            printf 'SCRAPEGRAPH_MODEL=%s\n' "$model"
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY:-}"
            printf 'LLM_API_KEY=%s\n' "${LLM_API_KEY:-}"
            printf 'SERPER_API_KEY=%s\n' "${SERPER_API_KEY:-}"
            printf 'WHATSAPP_API_BASE_URL=http://whatsapp-bridge:8080/api\n'
            printf 'WHATSAPP_MESSAGES_DB_PATH=/data/whatsapp/messages.db\n'
            printf 'OLLUM_ALLOW_WHATSAPP_SEND=false\n'
            printf 'OLLUM_AUTOPILOT_ALLOW_SEND=false\n'
            printf 'OLLUM_AUTOPILOT_DEFAULT_MODE=safe\n'
            printf 'OLLUM_AUTOPILOT_INTERVAL_MINUTES=45\n'
            printf 'OLLUM_GOOGLE_SHEETS_ENABLED=true\n'
            printf 'OLLUM_GOOGLE_SHEETS_ID=%s\n' "$GOOGLE_SHEETS_ID"
            printf 'GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/ollum-google-service-account.json\n'
            printf 'OLLUM_GOOGLE_SERVICE_ACCOUNT_HOST_FILE=../../shared/secrets/ollum-google-service-account.json\n'
          } > "$RUNNER_TEMP/production.env"
          chmod 600 "$RUNNER_TEMP/release.tgz" "$RUNNER_TEMP/production.env" "$credentials_file"

      - name: Transfer release over SSH
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p \"\$HOME/$INCOMING_PATH\""
          sshpass -e scp \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -P "$SSH_PORT" \
            "$RUNNER_TEMP/release.tgz" \
            "$RUNNER_TEMP/production.env" \
            "$RUNNER_TEMP/google-service-account.json" \
            "$SSH_USER@$SSH_HOST:$INCOMING_PATH/"
          rm -f -- "$RUNNER_TEMP/google-service-account.json"

      - name: Deploy release
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/remote_deploy.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$OLLUM_DOMAIN' '$RELEASE_ID' '$INCOMING_PATH' '$MCP_BIND_PORT'"

      - name: Roll back to previous release
        if: ${{ env.DEPLOY_MODE == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/remote_rollback.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER' '$OLLUM_DOMAIN' '$MCP_BIND_PORT'"

      - name: Verify production endpoints through local Nginx
        if: ${{ env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
            "https://$OLLUM_DOMAIN/health" >/dev/null

          unauthorized_status=$(curl --silent --show-error --max-time 20 \
            --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
            --output /dev/null --write-out '%{http_code}' \
            "https://$OLLUM_DOMAIN/mcp")
          [ "$unauthorized_status" = 401 ] || {
            echo "Expected unauthenticated /mcp to return 401, got $unauthorized_status" >&2
            exit 1
          }

          if [ "$DEPLOY_MODE" = deploy ]; then
            authenticated_status=$(curl --silent --show-error --max-time 30 \
              --resolve "$OLLUM_DOMAIN:443:127.0.0.1" \
              --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $MCP_BEARER_TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-check","version":"1"}}}' \
              "https://$OLLUM_DOMAIN/mcp")
            [ "$authenticated_status" = 200 ] || {
              echo "Authenticated /mcp check returned $authenticated_status" >&2
              exit 1
            }
          fi

      - name: Verify one SAFE Autopilot cycle and worker persistence
        if: ${{ env.DEPLOY_MODE == 'verify-autopilot' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$SSH_PASSWORD"
            cat deploy/verify_autopilot.sh
          } | sshpass -e ssh \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "sudo -S -p '' bash -s -- '$SSH_USER'"

  public-verification:
    name: Verify public production endpoints
    needs: production
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.mode == 'deploy' || inputs.mode == 'rollback')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
      OLLUM_DOMAIN: ${{ secrets.OLLUM_DOMAIN }}
      MCP_BEARER_TOKEN: ${{ secrets.OLLUM_MCP_BEARER_TOKEN }}

    steps:
      - name: Verify public health and MCP authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://$OLLUM_DOMAIN/health" >/dev/null

          unauthorized_status=$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            "https://$OLLUM_DOMAIN/mcp")
          [ "$unauthorized_status" = 401 ] || {
            echo "Expected unauthenticated /mcp to return 401, got $unauthorized_status" >&2
            exit 1
          }

          if [ "$DEPLOY_MODE" = deploy ]; then
            authenticated_status=$(curl --silent --show-error --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $MCP_BEARER_TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-public-check","version":"1"}}}' \
              "https://$OLLUM_DOMAIN/mcp")
            [ "$authenticated_status" = 200 ] || {
              echo "Authenticated public /mcp check returned $authenticated_status" >&2
              exit 1
            }
          fi
