name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            upstream/Scrapegraph-ai/pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./upstream/Scrapegraph-ai
          python -m pip install -e ".[test]"

      - name: Run Python tests
        run: python -m pytest -q tests

  whatsapp-go:
    name: WhatsApp Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: upstream/whatsapp-mcp/whatsapp-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/whatsapp-mcp/whatsapp-bridge/go.mod
          cache-dependency-path: upstream/whatsapp-mcp/whatsapp-bridge/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  deployment-contracts:
    name: Deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment scripts
        run: bash -n deploy/*.sh

      - name: Validate Docker Compose
        env:
          OLLUM_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/compose.json"
          python - "$RUNNER_TEMP/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              compose = json.load(handle)
          bridge = compose["services"]["whatsapp-bridge"]
          environment = bridge["environment"]
          assert environment["OLLUM_ALLOW_WHATSAPP_SEND"] == "false"
          healthcheck = " ".join(bridge["healthcheck"]["test"])
          assert "/health" in healthcheck
          PY
