name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            upstream/Scrapegraph-ai/pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=78.1.1"
          python -m pip install ./upstream/Scrapegraph-ai
          python -m pip install -e ".[test]"

      - name: Run Python tests
        run: >-
          python -m pytest -q tests
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=60

      - name: Check Python formatting and lint
        run: |
          python -m ruff format --check app tests
          python -m ruff check app tests

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable

  whatsapp-go:
    name: WhatsApp Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: upstream/whatsapp-mcp/whatsapp-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: upstream/whatsapp-mcp/whatsapp-bridge/go.mod
          cache-dependency-path: upstream/whatsapp-mcp/whatsapp-bridge/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: |
          go test -race -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 14.0) }'

      - name: Run Go vet
        run: go vet ./...

  deployment-contracts:
    name: Deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment scripts
        run: |
          bash -n deploy/*.sh
          docker run --rm \
            --entrypoint /bin/sh \
            --volume "$PWD:/workspace:ro" \
            koalaman/shellcheck-alpine:v0.11.0 \
            -c 'shellcheck /workspace/deploy/backup_data.sh /workspace/deploy/restore_data.sh /workspace/deploy/remote_deploy.sh'

      - name: Validate Docker Compose
        env:
          OLLUM_ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/compose.json"
          python - "$RUNNER_TEMP/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              compose = json.load(handle)
          bridge = compose["services"]["whatsapp-bridge"]
          environment = bridge["environment"]
          assert environment["OLLUM_ALLOW_WHATSAPP_SEND"] == "false"
          assert environment["OLLUM_WHATSAPP_TEST_RECIPIENTS"] == ""
          healthcheck = " ".join(bridge["healthcheck"]["test"])
          assert "/health" in healthcheck
          for name, service in compose["services"].items():
              assert service["user"] == "10001:10001", name
              assert service["read_only"] is True, name
              assert service["cap_drop"] == ["ALL"], name
              assert "no-new-privileges:true" in service["security_opt"], name
              assert any(path.startswith("/tmp:") for path in service["tmpfs"]), name
          PY

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime images
        run: |
          docker build --file Dockerfile.mcp --tag ollum-sales-mcp:ci .
          docker build --file Dockerfile.whatsapp --tag ollum-sales-whatsapp:ci .

      - name: Verify runtime dependency floors
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --entrypoint python ollum-sales-mcp:ci -c \
            'import msgpack, setuptools; from packaging.version import Version; assert Version(msgpack.__version__) >= Version("1.2.1"); assert Version(setuptools.__version__) >= Version("78.1.1")'

      - name: Scan fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln --pkg-types os \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --skip-version-check ollum-sales-mcp:ci
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress --skip-version-check ollum-sales-whatsapp:ci

      - name: Scan Dockerfile configuration
        run: |
          docker run --rm --volume "$PWD:/workspace:ro" \
            aquasec/trivy:0.74.0 config --severity HIGH,CRITICAL \
            --exit-code 1 --skip-version-check /workspace/Dockerfile.mcp
          docker run --rm --volume "$PWD:/workspace:ro" \
            aquasec/trivy:0.74.0 config --severity HIGH,CRITICAL \
            --exit-code 1 --skip-version-check /workspace/Dockerfile.whatsapp
          docker run --rm --volume "$PWD:/workspace:ro" \
            aquasec/trivy:0.74.0 config --severity HIGH,CRITICAL \
            --exit-code 1 --skip-version-check /workspace/deploy/Dockerfile.mcp-overlay
