name: Build WhatsApp bridge prebuilt

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional unique GitHub release tag
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ollum-sales-whatsapp-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux amd64 bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSET_NAME: ollum-sales-whatsapp-bridge-linux-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build in the production-compatible toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/src" \
            --workdir /src/upstream/whatsapp-mcp/whatsapp-bridge \
            golang:1.27.0-bookworm \
            bash -euo pipefail -c '
              go mod download
              CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
                go build -trimpath -ldflags="-s -w" \
                -o /src/dist/ollum-sales-whatsapp-bridge-linux-amd64 ./main.go
            '

      - name: Verify binary and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/$ASSET_NAME"
          test -s "$binary"
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/$binary:/usr/local/bin/whatsapp-bridge:ro" \
            debian:bookworm-slim \
            sh -euc 'test -x /usr/local/bin/whatsapp-bridge; ldd /usr/local/bin/whatsapp-bridge'

          sha256=$(sha256sum "$binary" | awk '{print $1}')
          printf '%s  %s\n' "$sha256" "$ASSET_NAME" > "dist/$ASSET_NAME.sha256"

          requested_tag='${{ inputs.release_tag }}'
          if [ -n "$requested_tag" ]; then
            [[ "$requested_tag" =~ ^[A-Za-z0-9._-]+$ ]] || {
              echo 'Invalid release tag' >&2
              exit 1
            }
            release_tag=$requested_tag
          else
            release_tag="whatsapp-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "WHATSAPP_PREBUILT_RELEASE_TAG=$release_tag"
          echo "WHATSAPP_PREBUILT_ASSET_NAME=$ASSET_NAME"
          echo "WHATSAPP_PREBUILT_SHA256=$sha256"

      - name: Publish immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.artifact.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/$ASSET_NAME" \
            "dist/$ASSET_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "WhatsApp bridge $RELEASE_TAG" \
            --notes "Production-compatible WhatsApp bridge binary for commit $GITHUB_SHA."

      - name: Summarize deployment inputs
        shell: bash
        run: |
          {
            echo '### WhatsApp prebuilt ready'
            echo
            echo "- release tag: \`${{ steps.artifact.outputs.release_tag }}\`"
            echo "- asset: \`$ASSET_NAME\`"
            echo "- SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
