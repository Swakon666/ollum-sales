# Managed by the Ollum Sales deployment workflow.
server {
    listen 80;
    listen [::]:80;
    server_name __OLLUM_DOMAIN__ __OLLUM_API_DOMAIN__;
    server_tokens off;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__/health;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The application root performs a same-origin redirect to the authenticated
    # control panel. Keep the broad catch-all closed below.
    location = / {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        # FastMCP validates the upstream Host to prevent DNS rebinding. The MCP
        # service is loopback-only, so pass its canonical internal Host while
        # Nginx validates the public domain through server_name and TLS/SNI.
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth discovery for ChatGPT/MCP clients.
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Closed-beta control panel. Authentication and authorization are enforced
    # by the application against the configured OIDC provider and allowlist.
    location = /admin {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__/admin;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        # Host is intentionally canonicalized for FastMCP DNS-rebinding checks;
        # preserve Nginx's validated public host separately for OAuth routing.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__OLLUM_MCP_BIND_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
